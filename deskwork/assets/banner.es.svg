<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-label="Deskwork: una suite de oficina rápida y hermosa para Windows y Linux">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="0.55" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="gWrite" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
    <linearGradient id="gGrid" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10b981"/><stop offset="1" stop-color="#06b6d4"/></linearGradient>
    <linearGradient id="gDeck" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f97316"/><stop offset="1" stop-color="#ec4899"/></linearGradient>
    <linearGradient id="gNotes" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a855f7"/><stop offset="1" stop-color="#ec4899"/></linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.25"/></filter>
    <clipPath id="round"><rect width="1280" height="340" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1280" height="340" fill="url(#bg)"/>
    <circle cx="1130" cy="-30" r="260" fill="#ffffff" opacity="0.10"/>
    <circle cx="-40" cy="380" r="240" fill="#ffffff" opacity="0.08"/>
    <circle cx="760" cy="360" r="180" fill="#ffffff" opacity="0.06"/>
  </g>

  <!-- logo -->
  <g filter="url(#soft)">
    <rect x="72" y="84" width="104" height="104" rx="30" fill="#ffffff" fill-opacity="0.22" stroke="#ffffff" stroke-opacity="0.55" stroke-width="2"/>
    <text x="124" y="156" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="64" font-weight="800" fill="#ffffff">D</text>
  </g>

  <!-- text -->
  <text x="208" y="146" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="76" font-weight="800" fill="#ffffff" letter-spacing="-2">Deskwork</text>
  <text x="212" y="196" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="27" font-weight="600" fill="#ffffff" fill-opacity="0.95">Write. Grid. Deck. Notes. Una suite hermosa y rápida.</text>
  <text x="212" y="236" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="19" fill="#ffffff" fill-opacity="0.82">Windows y Linux  ·  OOXML nativo  ·  Sincronización con NAS y nube  ·  Sin cinta de opciones</text>

  <!-- app tiles -->
  <g filter="url(#soft)">
    <rect x="936" y="62" width="104" height="104" rx="28" fill="url(#gWrite)"/>
    <rect x="1056" y="62" width="104" height="104" rx="28" fill="url(#gGrid)"/>
    <rect x="936" y="182" width="104" height="104" rx="28" fill="url(#gDeck)"/>
    <rect x="1056" y="182" width="104" height="104" rx="28" fill="url(#gNotes)"/>
  </g>
  <g fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <!-- Write -->
    <g transform="translate(962,88) scale(2.1)"><path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4"/><path d="M10 12h5M10 16h5"/></g>
    <!-- Grid -->
    <g transform="translate(1082,88) scale(2.1)"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 10h16M4 15h16M10 4v16"/></g>
    <!-- Deck -->
    <g transform="translate(962,208) scale(2.1)"><rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 21h8M12 17v4"/></g>
    <!-- Notes -->
    <g transform="translate(1082,208) scale(2.1)"><path d="M6 4h12v16H6z"/><path d="M9 4v16"/><path d="M12 9h3M12 13h3"/></g>
  </g>
</svg>
